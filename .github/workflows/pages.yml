name: Page

on:
  push:
    branches: ['**']
    paths:
      - 'Core/**'
      - 'Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v5
      - name: Install the WebAssembly SDK
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl
          curl -fLO https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
          swift sdk install swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
      - name: Build the instrument
        run: sh Web/build.sh core
      - uses: actions/upload-artifact@v5
        with:
          name: harmonica-wasm
          path: Web/core/harmonica.wasm
          retention-days: 1

  build:
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: harmonica-wasm
          path: Web/core
      - run: npm install
      - run: ./build.sh page "${GITHUB_SHA:0:8}"
      - if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Web

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
